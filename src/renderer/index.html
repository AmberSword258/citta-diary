<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: citta-img:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>观心 Citta</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/views.css">
  <!-- 主题与语言：必须在首帧前定下，避免先闪一下再变 -->
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>

  <!-- 启动锁屏：整屏即一张纸 -->
  <div id="lock" class="lock hidden">
    <div class="lock-card">
      <div class="lock-brand">
        <!-- 应用图标：由主进程读取项目根目录的 logo.png / logo.ico -->
        <img id="lock-logo" class="lock-logo" alt="观心" width="80" height="80">
        <h1>观心</h1>
        <p class="sub" data-i18n="Citta · 本地日记">Citta · 本地日记</p>
      </div>
      <div id="lock-body"></div>
      <p id="lock-msg" class="lock-msg"></p>
    </div>
    <p class="lock-foot" data-i18n="所有数据仅保存在本机 · 不联网 · 不上传">所有数据仅保存在本机 · 不联网 · 不上传</p>
  </div>

  <!-- 主界面 -->
  <div id="shell" class="shell hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">观心</span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="calendar">日历</button>
        <button class="tab" data-view="list">日记</button>
        <button class="tab" data-view="stats">统计</button>
      </nav>
      <div class="topbar-right">
        <button id="btn-search" class="ghost-btn" title="搜索（Ctrl+F）">搜索</button>
        <button id="btn-settings" class="ghost-btn" title="设置">设置</button>
      </div>
    </header>

    <div class="searchbar hidden" id="searchbar">
      <input id="search-input" type="search" placeholder="搜索标题与正文…（Esc 关闭）" autocomplete="off">
      <span id="search-count" class="search-count"></span>
      <button id="search-close" class="ghost-btn" aria-label="关闭搜索">收起</button>
    </div>

    <main class="content">
      <section id="view-calendar" class="view"></section>
      <section id="view-list" class="view hidden"></section>
      <section id="view-stats" class="view hidden"></section>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- 编辑器 -->
  <div id="editor" class="editor hidden">
    <header class="editor-bar">
      <button id="ed-back" class="ghost-btn">← 返回</button>
      <div class="editor-date">
        <strong id="ed-date-cn">—</strong>
        <span id="ed-date-sub" class="muted"></span>
      </div>
      <div class="editor-actions">
        <span id="ed-status" class="muted small"></span>
        <button id="ed-preview-toggle" class="ghost-btn">预览</button>
        <button id="ed-save" class="primary-btn">保存</button>
      </div>
    </header>

    <div class="editor-meta">
      <div class="meta-group">
        <label>心情</label>
        <div id="ed-mood" class="mood-picker"></div>
      </div>
      <div class="meta-group">
        <label>天气</label>
        <div id="ed-weather" class="chip-row"></div>
      </div>
      <div class="meta-group">
        <label>缩进</label>
        <div id="ed-indent" class="chip-row"></div>
      </div>
      <div class="meta-group wide">
        <label>大事</label>
        <input id="ed-event" type="text" placeholder="这一天发生的重要事情（可选）" maxlength="80">
      </div>
      <div class="meta-group wide">
        <label>标签</label>
        <div class="tag-wrap">
          <input id="ed-tags" type="text" placeholder="用空格或逗号分隔（可选）" autocomplete="off">
          <div id="tag-suggest" class="tag-suggest hidden"></div>
        </div>
      </div>
    </div>

    <div class="editor-body">
      <div class="editor-pane">
        <div id="md-toolbar" class="md-toolbar"></div>
        <div class="ed-input-wrap">
          <!-- 镜像层：负责显示逐段首行缩进的文字；文本域文字透明，只保留光标 -->
          <div id="ed-mirror" class="ed-mirror" aria-hidden="true"></div>
          <textarea id="ed-content" spellcheck="false" placeholder="写点什么…支持 Markdown：# 标题、**加粗**、*斜体*、- 列表、> 引用、--- 分割线、[链接](url)"></textarea>
        </div>
      </div>
      <div class="preview-pane">
        <div id="ed-preview" class="markdown"></div>
      </div>
    </div>

    <p id="ed-footer" class="editor-foot muted small"></p>
    <input id="ed-image-input" type="file" accept="image/*" multiple class="hidden">
  </div>

  <!-- 图片放大预览 -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" alt="图片预览">
  </div>

  <script src="lib/markdown.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/list.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

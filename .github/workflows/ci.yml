name: CI

# 关于运行环境的两点说明（都踩过坑）：
#
# 1. 必须清掉 ELECTRON_RUN_AS_NODE。
#    如果它被设为 1，Electron 会退化成纯 Node，
#    require('electron').app 变成 undefined，第 3–6 组测试全部无法运行。
#    某些 Node 版本管理器 / 其他 electron 项目会设置它。
#
# 2. 本 workflow 保持纯 ASCII。
#    runner 把 run: 块写入临时文件时，非 ASCII 字符可能被双重编码，
#    导致中文全角括号吞掉字符串闭合引号、整个步骤解析失败。
#
# 已知问题（不参与失败判定，见 "Known issues" 步骤）：
#   - 视觉规范：月历日期等「必读」文字对比度 5.7/5.95，低于项目自定的 ≥7
#     （已达 WCAG AA 的 4.5，但未达 app 自己的 AAA 标准）
#   - 端到端：英文界面下农历节日名「国庆节」未翻译

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  ELECTRON_RUN_AS_NODE: ''
  CITTA_TEST: '1'

jobs:
  ci:
    name: Test suite (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "node  $(node --version)"
          Write-Host "npm   $(npm --version)"
          Write-Host "ELECTRON_RUN_AS_NODE='$env:ELECTRON_RUN_AS_NODE' (must be empty)"
          Write-Host "CITTA_TEST='$env:CITTA_TEST'"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          Write-Host "electron installed at:"
          Test-Path .\node_modules\electron\dist\electron.exe

      - name: "Gate: pure-Node tests (lunar / markdown)"
        shell: pwsh
        run: |
          # 这两组不需要 Electron，必须通过
          node tests\lunar.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tests\markdown.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run full suite (report only)
        id: full
        shell: pwsh
        continue-on-error: true
        run: |
          node tests\run.js
          Write-Host "exit=$LASTEXITCODE"

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Full suite exit code: ${{ steps.full.outcome }}"
          if ('${{ steps.full.outcome }}' -ne 'success') {
            Write-Host "::warning::The full suite reported failures. See README 'Known issues'."
          }
